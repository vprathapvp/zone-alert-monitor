openapi: 3.0.3
info:
  title: Zone Watch API (fixed contract)
  version: 1.1.0
  description: |
    Fixed external contract for the Zone Watch software engineering assessment.
    Implement these endpoints exactly as described. Automated checks call them.
    You may add endpoints (for example a live stream for the UI), but you may
    not change the ones listed here.

    General rules
    - Business endpoints live under /api/v1 and use JSON with camelCase names.
    - Timestamps are ISO-8601 in UTC with milliseconds, for example 2026-11-02T06:00:05.120Z.
    - Errors use application/problem+json (RFC 9457) with a `code` from the catalogue below.
    - Coordinates are WGS84. A bbox is minLon,minLat,maxLon,maxLat. When minLon is greater
      than maxLon the box crosses the 180 degree meridian (RFC 7946, section 5.2).
    - List limits: assets default 1000, max 5000; track default 500, max 5000; alerts default 100,
      max 500. A limit outside 1..max is refused with 400 VALIDATION_FAILED.

    Problem codes
      400 VALIDATION_FAILED         401 UNAUTHENTICATED        403 FORBIDDEN
      403 NOT_ALERT_OWNER           404 NOT_FOUND              409 ALERT_ALREADY_CLAIMED
      409 INVALID_STATE             413 PAYLOAD_TOO_LARGE      415 UNSUPPORTED_MEDIA_TYPE
      500 INTERNAL_ERROR

    Rejection codes (one per rejected line of a batch)
      MALFORMED_JSON      the line is not a JSON object
      MISSING_FIELD       a required field is absent, null or an empty string
      INVALID_COORDINATE  lat or lon is not a number or is out of range
      INVALID_TIMESTAMP   observedAt cannot be read as an instant
      INVALID_FIELD       any other field breaks its rule (for example the assetId pattern)

    Changes in 1.1.0 (CR-1)
      Every stored report has a source type derived from its source: prefix SAT = SATELLITE,
      GND = GROUND, MOB = MOBILE, anything else or no source = UNKNOWN. Track points return it as
      sourceType and the track accepts the filter ?sourceType=.

    Roles
      INGEST      may call POST /reports/batch and GET /stats
      OPERATOR    may read assets and alerts; may claim, release and resolve alerts
      SUPERVISOR  as OPERATOR, and may release or resolve an alert owned by somebody else
servers:
  - url: http://localhost:8080
security:
  - bearerAuth: []
paths:
  /health:
    get:
      summary: Readiness. 200 when the instance can serve requests.
      security: []
      responses:
        "200":
          description: Ready
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, example: UP }
  /api/v1/auth/login:
    post:
      summary: Exchange username and password for a bearer token.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200":
          description: Token issued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoginResponse" }
        "401": { $ref: "#/components/responses/Problem" }
  /api/v1/reports/batch:
    post:
      summary: Deliver up to 1,000 position reports, one JSON document per line.
      description: |
        Role INGEST. Content-Type must be application/x-ndjson (else 415). At most 1,000
        non-empty lines and 5 MB per request (else 413). Every line is judged on its own:
        the answer is 200 even when some lines are rejected.

        accepted   the report is new and valid; it was stored
        duplicate  a report with this reportId was stored before (now or in an earlier request)
        rejected   the line is not a valid report; `rejections` says which line and why
        `line` is the 1-based position of the line among the non-empty lines of the request.
      requestBody:
        required: true
        content:
          application/x-ndjson:
            schema: { type: string }
            example: |
              {"reportId":"3f9a1c2b7d4e5f60","assetId":"AST-00417","kind":"SURFACE","observedAt":"2026-11-02T06:00:05.120Z","lat":35.41267,"lon":170.88421,"speedKn":14.2,"headingDeg":271.4,"source":"SAT-2"}
      responses:
        "200":
          description: Batch processed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BatchResult" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "413": { $ref: "#/components/responses/Problem" }
        "415": { $ref: "#/components/responses/Problem" }
  /api/v1/stats:
    get:
      summary: Running totals. Any authenticated role.
      responses:
        "200":
          description: Totals
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Stats" }
  /api/v1/assets:
    get:
      summary: Current position of every asset inside a bounding box.
      parameters:
        - name: bbox
          in: query
          required: true
          description: minLon,minLat,maxLon,maxLat. minLon greater than maxLon crosses the 180 degree meridian.
          schema: { type: string, example: "167.5,37.5,169.3,39.1" }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 5000, default: 1000 }
      responses:
        "200":
          description: Assets ordered by assetId
          content:
            application/json:
              schema:
                type: object
                required: [items, truncated]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/AssetPosition" }
                  truncated: { type: boolean, description: true when more assets matched than the limit }
        "400": { $ref: "#/components/responses/Problem" }
  /api/v1/assets/{assetId}:
    get:
      summary: Current position of one asset.
      parameters:
        - { name: assetId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Current position
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AssetPosition" }
        "404": { $ref: "#/components/responses/Problem" }
  /api/v1/assets/{assetId}/track:
    get:
      summary: Stored reports of one asset, oldest observedAt first.
      parameters:
        - { name: assetId, in: path, required: true, schema: { type: string } }
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 5000, default: 500 } }
        - name: sourceType
          in: query
          description: Only points of this source type (1.1.0). Any other value is refused with 400 VALIDATION_FAILED.
          schema: { $ref: "#/components/schemas/SourceType" }
      responses:
        "200":
          description: Track points
          content:
            application/json:
              schema:
                type: object
                required: [items, truncated]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/TrackPoint" }
                  truncated: { type: boolean }
        "400": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /api/v1/alerts:
    get:
      summary: Alerts, oldest first, with cursor paging.
      parameters:
        - { name: status, in: query, schema: { $ref: "#/components/schemas/AlertStatus" } }
        - { name: assetId, in: query, schema: { type: string } }
        - { name: zoneId, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500, default: 100 } }
        - { name: cursor, in: query, description: nextCursor of the previous page, schema: { type: string } }
      responses:
        "200":
          description: One page. Following nextCursor until it is null returns every alert exactly once.
          content:
            application/json:
              schema:
                type: object
                required: [items, nextCursor]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Alert" }
                  nextCursor: { type: string, nullable: true }
        "400": { $ref: "#/components/responses/Problem" }
  /api/v1/alerts/{alertId}:
    get:
      summary: One alert.
      parameters:
        - { name: alertId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Alert
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Alert" }
        "404": { $ref: "#/components/responses/Problem" }
  /api/v1/alerts/{alertId}/audit:
    get:
      summary: Every state change of one alert, oldest first.
      parameters:
        - { name: alertId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Audit trail
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/AuditEntry" }
        "404": { $ref: "#/components/responses/Problem" }
  /api/v1/alerts/{alertId}/claim:
    post:
      summary: Take ownership of an OPEN alert.
      description: |
        OPEN -> CLAIMED. The caller becomes the owner.
        Already CLAIMED by the caller: 200, nothing changes, no new audit entry.
        CLAIMED by somebody else: 409 ALERT_ALREADY_CLAIMED. RESOLVED: 409 INVALID_STATE.
      parameters:
        - { name: alertId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The alert after the command
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Alert" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /api/v1/alerts/{alertId}/release:
    post:
      summary: Give up ownership of a CLAIMED alert.
      description: |
        CLAIMED -> OPEN. Allowed for the owner and for a SUPERVISOR.
        Another OPERATOR: 403 NOT_ALERT_OWNER. Alert not CLAIMED: 409 INVALID_STATE.
      parameters:
        - { name: alertId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The alert after the command
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Alert" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /api/v1/alerts/{alertId}/resolve:
    post:
      summary: Close a CLAIMED alert with a note.
      description: |
        CLAIMED -> RESOLVED. Allowed for the owner and for a SUPERVISOR.
        Another OPERATOR: 403 NOT_ALERT_OWNER. Alert OPEN: 409 INVALID_STATE (claim it first).
        Already RESOLVED by the caller: 200, nothing changes, no new audit entry.
        Already RESOLVED by somebody else: 409 INVALID_STATE. Note missing, blank or longer
        than 500 characters: 400 VALIDATION_FAILED.
      parameters:
        - { name: alertId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [note]
              properties:
                note: { type: string, minLength: 1, maxLength: 500 }
      responses:
        "200":
          description: The alert after the command
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Alert" }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  responses:
    Problem:
      description: Error
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
  schemas:
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username: { type: string }
        password: { type: string }
    LoginResponse:
      type: object
      required: [accessToken, tokenType, expiresInSec, user]
      properties:
        accessToken: { type: string }
        tokenType: { type: string, example: Bearer }
        expiresInSec: { type: integer }
        user:
          type: object
          required: [username, role]
          properties:
            username: { type: string }
            role: { type: string, enum: [INGEST, OPERATOR, SUPERVISOR] }
    Report:
      type: object
      description: One line of the feed.
      required: [reportId, assetId, observedAt, lat, lon]
      properties:
        reportId: { type: string, maxLength: 64, description: Identity of the report. The same reportId is the same report. }
        assetId: { type: string, pattern: "^[A-Z0-9][A-Z0-9-]{2,31}$" }
        kind: { type: string, example: SURFACE, description: SURFACE or AIR }
        observedAt: { type: string, format: date-time, description: When the position was measured (event time). }
        lat: { type: number, minimum: -90, maximum: 90 }
        lon: { type: number, minimum: -180, maximum: 180 }
        speedKn: { type: number, nullable: true }
        headingDeg: { type: number, nullable: true }
        source: { type: string, nullable: true, example: SAT-2 }
    BatchResult:
      type: object
      required: [received, accepted, duplicates, rejected, rejections]
      properties:
        received: { type: integer }
        accepted: { type: integer }
        duplicates: { type: integer }
        rejected: { type: integer }
        rejections:
          type: array
          items:
            type: object
            required: [line, code]
            properties:
              line: { type: integer, description: 1-based position among the non-empty lines of the request }
              code: { type: string, enum: [MALFORMED_JSON, MISSING_FIELD, INVALID_COORDINATE, INVALID_TIMESTAMP, INVALID_FIELD] }
              detail: { type: string }
    Stats:
      type: object
      required: [received, accepted, duplicates, rejected, assets, alerts]
      properties:
        received: { type: integer }
        accepted: { type: integer, description: Number of stored reports }
        duplicates: { type: integer }
        rejected: { type: integer }
        assets: { type: integer, description: Number of assets with at least one stored report }
        alerts:
          type: object
          required: [open, claimed, resolved]
          properties:
            open: { type: integer }
            claimed: { type: integer }
            resolved: { type: integer }
    AssetPosition:
      type: object
      required: [assetId, reportId, observedAt, lat, lon]
      properties:
        assetId: { type: string }
        kind: { type: string, nullable: true }
        reportId: { type: string, description: The report that is the current position }
        observedAt: { type: string, format: date-time }
        lat: { type: number }
        lon: { type: number }
        speedKn: { type: number, nullable: true }
        headingDeg: { type: number, nullable: true }
        source: { type: string, nullable: true }
        sourceType: { $ref: "#/components/schemas/SourceType" }
    TrackPoint:
      type: object
      required: [reportId, observedAt, lat, lon, sourceType]
      properties:
        reportId: { type: string }
        observedAt: { type: string, format: date-time }
        lat: { type: number }
        lon: { type: number }
        source: { type: string, nullable: true }
        sourceType: { $ref: "#/components/schemas/SourceType" }
    SourceType:
      type: string
      description: Derived from source (1.1.0). SAT* = SATELLITE, GND* = GROUND, MOB* = MOBILE, else UNKNOWN.
      enum: [SATELLITE, GROUND, MOBILE, UNKNOWN]
    AlertStatus:
      type: string
      enum: [OPEN, CLAIMED, RESOLVED]
    Alert:
      type: object
      required: [alertId, assetId, zoneId, status, openedAt, triggerReportId]
      properties:
        alertId: { type: string }
        assetId: { type: string }
        zoneId: { type: string }
        status: { $ref: "#/components/schemas/AlertStatus" }
        openedAt: { type: string, format: date-time, description: Server time when the alert was created }
        triggerReportId: { type: string }
        triggerObservedAt: { type: string, format: date-time }
        claimedBy: { type: string, nullable: true }
        claimedAt: { type: string, format: date-time, nullable: true }
        resolvedBy: { type: string, nullable: true }
        resolvedAt: { type: string, format: date-time, nullable: true }
        resolutionNote: { type: string, nullable: true }
    AuditEntry:
      type: object
      required: [at, actor, action, toStatus]
      properties:
        at: { type: string, format: date-time }
        actor: { type: string, description: Username, or "system" for OPENED }
        action: { type: string, enum: [OPENED, CLAIMED, RELEASED, RESOLVED] }
        fromStatus: { type: string, nullable: true }
        toStatus: { $ref: "#/components/schemas/AlertStatus" }
    Problem:
      type: object
      required: [type, title, status, code]
      properties:
        type: { type: string, example: "about:blank" }
        title: { type: string }
        status: { type: integer }
        code: { type: string }
        detail: { type: string }
        instance: { type: string }
