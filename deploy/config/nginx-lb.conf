# Load balancer in front of the two backend instances and the console. Port 8080.
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 2048; }

http {
    server_tokens off;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    map $http_x_request_id $req_id { default $http_x_request_id; "" $request_id; }

    log_format json escape=json '{"timestamp":"$time_iso8601","level":"INFO","logger":"lb","message":"request",'
        '"requestId":"$req_id","method":"$request_method","path":"$uri","status":$status,'
        '"durationMs":$request_time,"upstream":"$upstream_addr","upstreamStatus":"$upstream_status"}';
    access_log /dev/stdout json;

    # Fixed addresses from compose.yaml (backend-1, backend-2, console-1, console-2). A recreated
    # container returns at the same address; no DNS, so nothing stale can point at another service.
    upstream api {
        server 10.242.42.11:8080 max_fails=3 fail_timeout=5s;
        server 10.242.42.12:8080 max_fails=3 fail_timeout=5s;
    }
    upstream console {
        server 10.242.42.21:8080 max_fails=3 fail_timeout=5s;
        server 10.242.42.22:8080 max_fails=3 fail_timeout=5s;
    }

    server {
        listen 8080;
        client_max_body_size 32m;

        proxy_set_header Host $host;
        proxy_set_header X-Request-Id $req_id;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 2s;
        proxy_read_timeout 60s;
        # An instance that is down, or draining (503 before doing any work), is skipped and the
        # request goes to the other one. POSTs are retried too: ingest is idempotent by reportId,
        # and a draining instance answers 503 without processing anything.
        proxy_next_upstream error timeout http_502 http_503 non_idempotent;
        proxy_next_upstream_tries 3;
        proxy_next_upstream_timeout 15s;

        location = /health { proxy_pass http://api; }
        location /actuator/ { proxy_pass http://api; }

        location = /api/v1/live {
            proxy_pass http://api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 1h;
        }

        location /api/ { proxy_pass http://api; }

        location / {
            proxy_pass http://console;
            proxy_next_upstream error timeout http_502 http_503;
        }
    }
}
