# Zone monitoring system: database, migrate step, two backend instances, console, load balancer.
# Image versions come from an env file (versions/*.env) so every deploy and upgrade step is one
# explicit command. Secrets are files in ./secrets, mounted read-only; nothing secret is in an image.
name: geoalert

x-backend-env: &backend-env
  DB_URL: jdbc:postgresql://db:5432/geoalert
  DB_USER: geoalert
  USERS_FILE: /run/secrets/users.json
  MAX_FUTURE_SKEW: ${MAX_FUTURE_SKEW:-PT24H}
  DB_POOL_SIZE: "12"
  JAVA_TOOL_OPTIONS: "-Xmx640m -XX:+ExitOnOutOfMemoryError -Duser.timezone=UTC"

x-hardening: &hardening
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  tmpfs: [/tmp]
  logging:
    driver: json-file
    options: { max-size: "20m", max-file: "5" }

services:
  db:
    image: postgres:16.8-alpine
    environment:
      POSTGRES_DB: geoalert
      POSTGRES_USER: geoalert
      POSTGRES_PASSWORD_FILE: /run/secrets/DB_PASSWORD
    secrets: [DB_PASSWORD]
    command:
      - postgres
      - -c
      - shared_buffers=512MB
      - -c
      - max_connections=100
      - -c
      - log_min_duration_statement=500
      - -c
      - idle_in_transaction_session_timeout=60000
      # Fewer forced checkpoints and smaller WAL during bulk work (CR-1 backfill): in rehearsal the
      # 1 GB default caused checkpoint fsync storms that stalled live commits on a slow disk.
      - -c
      - max_wal_size=4GB
      - -c
      - wal_compression=on
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U geoalert -d geoalert"]
      interval: 3s
      timeout: 3s
      retries: 30
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    networks: { internal: { ipv4_address: 10.242.42.2 } }
    mem_limit: 2g
    shm_size: 256m

  # One-shot: Flyway migrations (up to FLYWAY_TARGET) and zone load. Exits when done.
  migrate:
    <<: *hardening
    image: geoalert-backend:${MIGRATE_VERSION:-1.1.0}
    command: ["migrate"]
    environment:
      <<: *backend-env
      FLYWAY_TARGET: ${FLYWAY_TARGET:-latest}
      JAVA_TOOL_OPTIONS: "-Xmx256m -Duser.timezone=UTC"
    secrets: [DB_PASSWORD]
    depends_on:
      db: { condition: service_healthy }
    restart: "no"
    networks: [internal]
    mem_limit: 512m

  backend-1:
    <<: *hardening
    image: geoalert-backend:${BACKEND_1_VERSION:-1.1.0}
    environment:
      <<: *backend-env
      INSTANCE_ID: backend-1
    networks: { internal: { ipv4_address: 10.242.42.11 } }
    secrets: [DB_PASSWORD, users.json]
    depends_on:
      migrate: { condition: service_completed_successfully }
    restart: unless-stopped
    stop_grace_period: 40s
    mem_limit: 1g

  backend-2:
    <<: *hardening
    image: geoalert-backend:${BACKEND_2_VERSION:-1.1.0}
    environment:
      <<: *backend-env
      INSTANCE_ID: backend-2
    networks: { internal: { ipv4_address: 10.242.42.12 } }
    secrets: [DB_PASSWORD, users.json]
    depends_on:
      migrate: { condition: service_completed_successfully }
    restart: unless-stopped
    stop_grace_period: 40s
    mem_limit: 1g

  console-1: &console
    <<: *hardening
    image: geoalert-console:${CONSOLE_1_VERSION:-1.1.0}
    networks: { internal: { ipv4_address: 10.242.42.21 } }
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    mem_limit: 64m

  # Two console replicas so the console is never down while one of them is replaced.
  console-2:
    <<: *console
    image: geoalert-console:${CONSOLE_2_VERSION:-1.1.0}
    networks: { internal: { ipv4_address: 10.242.42.22 } }

  lb:
    <<: *hardening
    image: nginxinc/nginx-unprivileged:1.27.4-alpine
    volumes:
      - ./config/nginx-lb.conf:/etc/nginx/nginx.conf:ro
    ports: ["8080:8080"]
    networks: { internal: { ipv4_address: 10.242.42.10 } }
    depends_on:
      backend-1: { condition: service_started }
      backend-2: { condition: service_started }
      console-1: { condition: service_started }
      console-2: { condition: service_started }
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped
    mem_limit: 128m

# Fixed addresses: a recreated container gets its own address back, so the load balancer can never
# reach a different service at an address it remembers (dynamic IPs were reused across services
# during a rolling upgrade in rehearsal). If 10.242.42.0/24 collides with a network at the site,
# change it here and in config/nginx-lb.conf.
networks:
  internal:
    ipam:
      config:
        - subnet: 10.242.42.0/24
          ip_range: 10.242.42.128/25   # dynamic addresses (migrate) never take a pinned one

volumes:
  pgdata: {}

secrets:
  DB_PASSWORD:
    file: ./secrets/DB_PASSWORD
  users.json:
    file: ./secrets/users.json
