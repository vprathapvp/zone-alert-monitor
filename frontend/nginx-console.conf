# Static console. The Content-Security-Policy forbids the browser from contacting any other host.
server {
    listen 8080;
    server_tokens off;
    root /usr/share/nginx/html;
    set $csp "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'";

    location /assets/ {
        add_header Content-Security-Policy $csp always;
        add_header X-Content-Type-Options nosniff always;
        add_header Cache-Control "public, max-age=604800, immutable" always;
    }
    location / {
        try_files $uri /index.html;
        add_header Content-Security-Policy $csp always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header Cache-Control "no-cache" always;
    }
}
